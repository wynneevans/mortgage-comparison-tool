[project]
name = "mortgage-api"
version = "0.1.0"
description = "Mortgage comparison API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
