[project]
name = "mortgage-api"
version = "0.1.0"
description = "Mortgage comparison API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "firebase-admin>=6.0.0",
    "firebase-functions~=0.5.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
functions = [
    "firebase-functions>=0.5.0",
    "firebase-admin>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mortgage_api"]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.9",
]
package = true

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
